# ─── Permissions ──────────────────────────────────────────
# Tool permission defaults. "*" = global policy for all tools.
# Individual tools can override: read, edit, glob, grep, http, skill, etc.
# Actions: "allow", "deny", "ask" (prompt user)
#
[permissions]
"*" = "ask"
read = "allow"
glob = "allow"
grep = "allow"
edit = "ask"   # editing files is destructive
patch = "ask"   # patching files is destructive
http = "ask"   # network access
skill = "allow"
"context7*" = "allow"
#
# Nested field rules (e.g. restrict specific commands):
# [permissions.nu__run.command]
# "rm*" = "deny"
# "git push*" = "deny"

# ─── MCP Servers ───────────────────────────────────────────
# Configure MCP (Model Context Protocol) servers here.
# Transports: "stdio" (local process), "sse" or "http" (remote).
#
[mcp.context7]
transport = "sse"
url = "https://mcp.context7.com/mcp/oauth"
auth = { type = "oauth" }
enabled = false

[mcp.c5t]
transport = "sse"
url = "http://127.0.0.1:3737/mcp"

[mcp.c5t_dev]
enabled = false
transport = "sse"
url = "http://127.0.0.1:3738/mcp"

# [mcp.nu]
# transport = "stdio"
# command = "NU_MCP_PATH"
# args = ["--add-path", "/tmp", "--add-path", "/nix/store"]

# [mcp.nu.env]
# GIT_PAGER = ""

# [mcp.tmux]
# enabled = false
# transport = "stdio"
# command = "NU_MCP_PATH"
# args = ["--tools-dir", "NU_MCP_TOOLS_PATH/tmux"]

[mcp.gh]
enabled = false
transport = "stdio"
command = "NU_MCP_PATH"
args = [
  "--tools-dir", "NU_MCP_TOOLS_PATH/gh",
  "--add-read-path", "~/.config/gh",
  "--add-read-path", "~/.config/git"
]
[mcp.gh.env]
GITHUB_TOKEN = "cmd:gh auth token"

[mcp.nu]
enabled = false
transport = "stdio"
command = "NU_MCP_PATH"
args = [ 
  "--add-path", "/tmp", 
]
[mcp.nu.env]
GITHUB_TOKEN = "cmd:gh auth token"
#
# [mcp.nu.env]
# GIT_PAGER = ""
#
# Auth (optional):
# [mcp.api]
# transport = "http"
# url = "https://api.example.com/mcp"
#
# [mcp.api.auth]
# type = "bearer"
# token = "your-token"  # bearer tokens are stored here, not in secrets.json
#
# OAuth (for providers like GitHub Copilot):
# [mcp.api.auth]
# type = "oauth"
# # run: agent mcp auth login my-api

