# nu-agent configuration
# Generated by `agent config init`
# Full provider list: run `agent models list`
# API keys: run `agent provider auth login <provider>` (stored in secrets.json, not here)

# Edit this to set your default model:
[models.default]
model = "ollama-cloud/deepseek-v4-flash:0731"

[models.heavy]
model = "ollama-cloud/deepseek-v4-pro"

[models.light]
model = "ollama-cloud/gemma4:31b"

# ─── Templates ───────────────────────────────────────────
# Uncomment and fill in for providers you use.
# API keys are stored in secrets.json via `agent provider auth login`.

# OpenAI
# [providers.openai]
# api_key = "store:openai"  # run: agent provider auth login openai

# Anthropic
# [providers.anthropic]
# api_key = "store:anthropic"  # run: agent provider auth login anthropic

# Ollama Cloud
[providers.ollama-cloud]
provider = "openai"
base_url = "https://ollama.com/v1"
api_key = "store:ollama-cloud"  # run: agent provider auth login ollama-cloud
 
# GitHub Copilot (OAuth — no api_key needed)
# [providers.github-copilot]
# # run: agent provider auth login github-copilot

# Local Ollama (no auth)
[providers.ollama]
provider = "ollama"
base_url = "http://localhost:11434"

[providers.ollama.models."gemma4:31b-mlx"]
[providers.ollama.models."qwen3.6:35b-mlx"]
[providers.ollama.models."ornith:35b"]
[providers.ollama.models."gemma4:26b-mlx"]
[providers.ollama.models."qwen3.6:27b-mlx"]

# ─── Permissions ──────────────────────────────────────────
# Tool permission defaults. "*" = global policy for all tools.
# Individual tools can override: read, edit, glob, grep, http, skill, etc.
# Actions: "allow", "deny", "ask" (prompt user)
#
[permissions]
"*" = "ask"
read = "allow"
glob = "allow"
grep = "allow"
edit = "ask"   # editing files is destructive
patch = "ask"   # patching files is destructive
http = "ask"   # network access
skill = "allow"
"context7*" = "allow"
#
# Nested field rules (e.g. restrict specific commands):
# [permissions.nu__run.command]
# "rm*" = "deny"
# "git push*" = "deny"

# ─── MCP Servers ───────────────────────────────────────────
# Configure MCP (Model Context Protocol) servers here.
# Transports: "stdio" (local process), "sse" or "http" (remote).
#
[mcp.context7]
transport = "sse"
url = "https://mcp.context7.com/mcp/oauth"
auth = { type = "oauth" }

[mcp.c5t]
transport = "sse"
url = "http://127.0.0.1:3737/mcp"

[mcp.c5t_dev]
enabled = false
transport = "sse"
url = "http://127.0.0.1:3738/mcp"

[mcp.nu]
transport = "stdio"
command = "NU_MCP_PATH"
args = ["--add-path", "/tmp", "--add-path", "/nix/store"]

[mcp.nu.env]
GIT_PAGER = ""

[mcp.tmux]
enabled = false
transport = "stdio"
command = "NU_MCP_PATH"
args = ["--tools-dir", "NU_MCP_TOOLS_PATH/tmux"]

[mcp.gh]
enabled = false
transport = "stdio"
command = "NU_MCP_PATH"
args = ["--tools-dir", "NU_MCP_TOOLS_PATH/gh"]
#
# [mcp.nu]
# transport = "stdio"
# command = "nu-mcp"
# args = ["--add-path", "/tmp"]
#
# [mcp.nu.env]
# GIT_PAGER = ""
#
# Auth (optional):
# [mcp.api]
# transport = "http"
# url = "https://api.example.com/mcp"
#
# [mcp.api.auth]
# type = "bearer"
# token = "your-token"  # bearer tokens are stored here, not in secrets.json
#
# OAuth (for providers like GitHub Copilot):
# [mcp.api.auth]
# type = "oauth"
# # run: agent mcp auth login my-api

# Run `agent models sync` then `agent models list` to see all available providers.
