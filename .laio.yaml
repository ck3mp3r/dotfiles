name: dotfiles

path: .

windows:
  - name: code
    panes:
      - flex: 2
        focus: true
        commands:
          - command: ^$env.EDITOR
      - flex: 1
        commands:
          - command: ^agent
            args:
              - --agent
              - maker

  - name: misc
    panes:
      - flex: 1
      - flex: 1
